<!-- administrador.component.html -->
<section>
  <div class="container container__admin-institutos">
    <div class="row">
      <h2 class="container__admin-institutos--title">Gestión de Institutos</h2>
    </div>
    <div class="row d-flex justify-content-end mb-3">
      <button
        data-bs-toggle="modal"
        data-bs-target="#editCreateModal"
        class="btn container__admin-institutos--btn"
        (click)="resetForm()"
      >
        + Agregar
      </button>
    </div>

    <app-table
      [instituciones]="institutos"
      [error]="error"
      [loading]="loading"
      (editar)="handleEditar($event)"
      (eliminar)="handleEliminar($event)"
      (guardar)="handleSave($event)"
      (reintentar)="handleReintentar()"
    />
  </div>
</section>
